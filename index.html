<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Made Simple: The 30 Day Finish It Plan</title>
<meta name="description" content="One task a day for thirty days. The prompt is on the day, ready to copy.">
<meta name="theme-color" content="#1a0a2e">
<style>
:root{
  color-scheme:dark;
  --ink:#1a0a2e;--line:rgba(255,255,255,.13);--purple:#7c4dde;--purple2:#9b6cff;
  --gold:#f0c24b;--mint:#4ade80;--fg:#fff;--mut:#b4a6d2;--dim:#8a7cab;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--fg);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background-image:radial-gradient(850px 560px at 12% -8%,rgba(124,77,222,.26),transparent 62%);
  background-attachment:fixed}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 56px}
.tag{font:800 10.5px/1 inherit;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{font-family:Georgia,"Times New Roman",serif;font-size:32px;line-height:1.14;margin:12px 0 8px}
.lede{color:var(--mut);margin:0 0 22px;max-width:52ch}
.stats{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.stat{flex:1 1 130px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:Georgia,serif;font-size:27px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--dim)}
.bar{height:9px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden;margin:4px 0 24px}
.bar i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.wk{font:800 10.5px/1 inherit;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);margin:26px 0 9px}
.day{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
  background:rgba(255,255,255,.035);overflow:hidden}
.day.done{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.3)}
.dhead{display:flex;align-items:flex-start;gap:13px;padding:14px 16px;cursor:pointer}
.tick{width:25px;height:25px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;
  display:grid;place-items:center;margin-top:1px;background:none;cursor:pointer;padding:0}
.day.done .tick{background:var(--mint);border-color:var(--mint)}
.day.done .tick::after{content:"\2713";color:#06281a;font-weight:800;font-size:14px}
.dmain{flex:1;min-width:0}
.dno{font-size:11.5px;color:var(--gold);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.dtask{font-weight:600;font-size:15.5px;margin-top:2px}
.dcourse{font-size:13px;color:var(--dim);margin-top:2px}
.dbody{display:none;padding:0 16px 16px 54px}
.day.open .dbody{display:block}
label{display:block;font:800 10.5px/1 inherit;letter-spacing:.12em;text-transform:uppercase;
  color:var(--purple2);margin:14px 0 5px}
.why{color:var(--mut);font-size:14px;margin:0 0 4px}
.pblock{margin:12px 0 4px}
.plabel{font:800 10.5px/1 inherit;letter-spacing:.12em;text-transform:uppercase;
  color:var(--purple2);margin-bottom:7px}
.helper{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.hhead{font:800 10.5px/1 inherit;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);margin-bottom:9px}
.hbody{margin-top:2px}
.htitle{font-weight:700;font-size:15px;margin-bottom:3px}
.hout{background:#120822;border:1px solid var(--line);border-radius:10px;padding:15px;
  font:13px/1.65 "SF Mono",Menlo,Consolas,monospace;white-space:pre-wrap;
  word-wrap:break-word;margin:9px 0 11px;max-height:38vh;overflow:auto}
.bar2{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
button.btn{background:var(--purple);color:#fff;border:0;border-radius:11px;padding:12px 18px;
  font:700 15px inherit;cursor:pointer}
button.btn.ghost{background:rgba(255,255,255,.07);border:1.5px solid var(--line);color:var(--fg)}
footer{color:var(--dim);font-size:12px;text-align:center;margin-top:30px;padding-top:15px;
  border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);
  background:var(--mint);color:#06281a;font-weight:700;padding:12px 22px;border-radius:30px;
  opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:520px){h1{font-size:26px}.dbody{padding-left:16px}}
@media print{body{background:#fff;color:#000}.bar2,.toast{display:none}.dbody{display:block}}
</style></head><body>
<div class="wrap">
  <span class="tag">AI MADE SIMPLE</span>
  <h1>The 30 Day Finish It Plan</h1>
  <p class="lede">One task a day, about twenty minutes. Open a day, copy the
    prompt, run it, then tick it off. Your progress saves in this browser.</p>

  <div class="stats">
    <div class="stat"><b id="done">0</b><span>days done</span></div>
    <div class="stat"><b id="left">30</b><span>still to go</span></div>
    <div class="stat"><b id="streak">0</b><span>in a row from day 1</span></div>
  </div>
  <div class="bar"><i id="barfill"></i></div>

  <div id="days"></div>

  <div class="bar2">
    <button class="btn" id="copy">Copy what I have done</button>
    <button class="btn ghost" id="openall">Open or close all</button>
  </div>
  <footer>GetPaidToBeYouOnline</footer>
</div>
<div class="toast" id="toast"></div>
<script>const DAYS=[{"day": 1, "course": null, "title": "Set yourself up", "task": "Watch the three Start Here videos, then do the Setup Once Pack.", "why": "Twenty minutes now saves you explaining yourself in every conversation for the rest of the month.", "prompt": "Your first conversation.", "prompt_text": "I am starting a 30 day plan to finally learn to use AI properly. Before I\nbegin, tell me where it is actually going to help me.\n\nWhat I do: [what you do, in your own words]\nWhat my week usually looks like: [the things that fill it, including the dull ones]\nWhat I have tried with AI before: [nothing at all, or what you tried and what happened]\nWhat I would like to be different in a month: [be honest and be specific]\n\nPlease:\n1. Name the three things in my week where this will make the most difference,\n   and say why those three rather than the others.\n2. Name one thing I am probably expecting it to do that it will not do well,\n   so I am not disappointed in a fortnight.\n3. Tell me what a realistic first week looks like for somebody in my position,\n   not an ideal one.\n4. Ask me the one question that would most change your answer.\n\nBe straight with me rather than encouraging.", "helper": {"title": "Check your setup actually took", "note": "Run this after pasting your about-me block, to see whether it landed.", "text": "Without me telling you again, what do you already know about me and how I\nwant to be written for?\n\nList it back. Then write me two sentences about anything, so I can hear whether\nit sounds like me.\n\nI expect you to know: [what it should now know about you]\nIf any of that is missing, say so plainly, because it means my setup did not\nsave."}}, {"day": 2, "course": 1, "title": "What AI Actually Is", "task": "Asking AI to explain itself", "why": "The best way to understand a tool is to ask it directly. This gives you a plain explanation you can remember and repeat to someone else.", "prompt": "Course 01, the first prompt.", "prompt_text": "Explain what you are in plain English. No jargon, and do\nnot assume I know anything about technology.\n\nTell me:\n1. What are you, in one paragraph, as if I had never heard\n   of AI?\n2. How did you learn to do this, and what does that training\n   actually mean in simple terms?\n3. What are you genuinely good at, and what should I not\n   rely on you for?\n4. When you give a wrong answer, why does that happen?\n5. The most important thing to understand about using you\n   responsibly.\n\nBe honest. Do not make yourself sound more capable than you\nare. I want to understand you, not be impressed.", "helper": {"title": "Go deeper on the part that did not land", "note": "For whatever was still fuzzy after the first answer.", "text": "In your last answer, this part did not land for me:\n\n[the bit that did not land]\n\nExplain just that, [how to explain it]. Use a comparison to something ordinary.\nThen ask me one question to check whether I have actually understood it this\ntime, rather than moving on."}}, {"day": 3, "course": 2, "title": "Claude", "task": "Writing content in your voice", "why": "Claude is the strongest free AI for content that sounds like you. Give it your real context and you barely need to edit.", "prompt": "Course 02, the first prompt.", "prompt_text": "I create content about [your specific topic] for [your\naudience: who they are and what they care about].\n\nMy brand tone: [how you write, such as warm and direct,\nconversational, no jargon, British spelling].\n\nWrite 5 social media posts about [your topic for this week].\nEach post must:\n- Open with a line that makes someone stop scrolling\n- Stay under 150 words\n- Sound like a real person, not a brand announcement\n- End with a question or a clear next step\n\nNo preamble before the first post. Just write the 5 posts.", "helper": {"title": "Make it sound more like you", "note": "When the writing is good but not yours.", "text": "This draft is close but it does not sound like me.\n\nWhat is off: [what is off about it]\n\nHere is something I actually wrote, so you can hear my voice:\n[a line or two of your own writing]\n\nThe draft:\n[the draft it gave you]\n\nRewrite it in my voice. Keep my sentence lengths and the words I would\nactually use. Do not make it more polished than I am. Then tell me the two\nthings you changed that made the biggest difference."}}, {"day": 4, "course": 3, "title": "ChatGPT", "task": "Generating images for everyday life", "why": "ChatGPT makes images from a description. Useful for illustrations, cards and visuals when you have no photo and no design skills.", "prompt": "Course 03, the first prompt.", "prompt_text": "Generate an image of [exactly what you want to see: the\nsubject, the setting, and what is happening].\n\nStyle: [photorealistic / illustration / watercolour / flat\ndesign / cartoon / minimal / vintage].\nColours: [the palette, such as warm earth tones, soft pastels,\nor white and gold].\nMood: [calm and cosy / energetic / clean and professional].\nShape: [square / landscape / portrait].\n\nAnything specific: [no text in the image / include a person /\nno people / outdoors].\n\nExample: a cosy kitchen table with a cup of tea, a notebook,\nand autumn leaves outside the window. Watercolour. Warm\norange and brown. Calm and inviting.", "helper": {"title": "Fix the picture without starting again", "note": "When it is nearly right.", "text": "Keep this picture and change one thing.\n\nWhat to change: [what is wrong with it]\nWhat must stay exactly as it is: [what to keep exactly as it is]\n\nAdjust the version you just made rather than making a new one, so it stays\nrecognisably the same picture. If what I am asking for will not work, say so\nbefore you try."}}, {"day": 5, "course": 4, "title": "Gemini", "task": "Writing a first draft in Canvas", "why": "Canvas gives you an editable document beside the chat, which is where anything longer than a paragraph belongs.", "prompt": "Course 04, the first prompt.", "prompt_text": "[Click Canvas in the message box before you paste this]\n\nWrite a complete [email / social post / product description /\nlesson / newsletter / plan].\n\nTopic: [what this is about, specifically].\nWho will read it: [the person or people].\nTone: [friendly / professional / warm / direct].\nKey points to include:\n- [Point 1]\n- [Point 2]\n- [Point 3]\nLength: [under 150 words / 250 to 350 words / full document].\n\nWrite it in full, with no placeholder text and no instruction\nsentences left in. Ready to use with light editing.", "helper": {"title": "Cut a draft that is too long", "note": "The commonest problem with a first draft.", "text": "Cut this down to [how long it should be].\n\nWhat must stay: [what absolutely must stay in]\n\nThe draft:\n[the draft]\n\nCut whole sentences rather than trimming words. Keep my phrasing in what\nsurvives. Then tell me what you cut that you were least sure about, in case I\nwant it back."}}, {"day": 6, "course": 5, "title": "Gemini Notebook", "task": "Understanding something you already own", "why": "Use this on the course, report or document you paid for and never finished.", "prompt": "Course 05, the first prompt.", "prompt_text": "[Upload your document first, then paste this]\n\nUsing only the sources I have uploaded, and no outside\nknowledge, tell me:\n\n1. The 5 most important ideas in this material.\n2. What it actually tells me to do, in order.\n3. What it assumes about the reader that might not be\n   true for me.\n4. What it leaves unanswered.\n\nGive me the citation for each point so I can check it.", "helper": {"title": "Check it against your own document", "note": "Make sure the answer came from your source, not from elsewhere.", "text": "You told me this:\n\n[the part you want to check]\n\nShow me exactly where in my uploaded sources that comes from. Quote the\npassage.\n\nIf it is not in my sources and you worked it out or knew it already, say so\nplainly. I need to know which parts of your answer are from my document and\nwhich are not."}}, {"day": 7, "course": 6, "title": "Perplexity", "task": "Research you can verify", "why": "It searches the web in real time and returns a sourced answer, which matters for anything where being right counts.", "prompt": "Course 06, the first prompt.", "prompt_text": "I want to understand [your question, written the way you\nwould ask a knowledgeable friend].\n\nTell me:\n1. What is the current situation with this?\n2. The three most important things to know about it.\n3. What has changed in the last year.\n4. One thing most people get wrong about this.\n\nUse sources from the last 12 months where you can.\nCite every significant claim so I can check the important\npoints myself.", "helper": {"title": "Check a claim before you repeat it", "note": "Before you say it out loud or put it in writing.", "text": "I am about to rely on this: [the claim]\n\nWhat I need it for: [what you need it for]\n\nCheck it. Tell me:\n1. Whether it is accurate, overstated, or wrong.\n2. Where the good evidence for it is, with dates.\n3. Whether anyone credible disagrees, and on what.\n4. The safest way for me to phrase it so I am not claiming more than is known.\n\nIf you cannot verify it, say so rather than giving me something that sounds\nconfident."}}, {"day": 8, "course": 7, "title": "Meta AI", "task": "Writing captions inside Instagram", "why": "Tap the search bar, tap Ask Meta AI, and describe your post. Useful for anyone who posts often and runs dry on captions.", "prompt": "Course 07, the first prompt.", "prompt_text": "Write 3 Instagram captions for a post about [what the\nimage or video shows, and what you want people to feel].\n\nMy audience: [who follows you and what they respond to].\nMy tone: [friendly / motivating / educational / personal\nstory / funny].\nGoal: [comments / saves / clicks to my link / starting a\nconversation].\n\nEach caption must:\n- Open with one line that stops the scroll\n- Stay under 150 words\n- Sound like a real person, not a scheduled brand post\n- End with a question or a clear next step", "helper": {"title": "Make the caption shorter and less keen", "note": "Captions usually come back twice as long as they should be.", "text": "Make this caption shorter and less keen.\n\nHow it should sound: [how it should sound]\n\nThe caption:\n[the caption]\n\nRules: cut it by at least a third, no exclamation marks, no emoji unless I\nalready used one, no opening line that announces what the post is about.\n\nGive me three versions of different lengths. Then say which one you would post\nand why."}}, {"day": 9, "course": 8, "title": "Microsoft Copilot", "task": "Writing any document or email", "why": "It writes complete documents from a description, and it is particularly good at professional tone where getting it right matters.", "prompt": "Course 08, the first prompt.", "prompt_text": "Write a complete [email / letter / report section /\nproposal / plan / meeting agenda].\n\nPurpose: [what it must achieve, specifically].\nWho will read it: [their role and what they care about].\nTone: [professional / warm / direct / formal / friendly].\nKey points to cover:\n- [Point 1]\n- [Point 2]\n- [Point 3]\nLength: [under 150 words / 250 to 400 words / full document].\n\nWrite it in full. No placeholder text and no instruction\nsentences left inside. Ready to send after light editing.", "helper": {"title": "Make a document sound less like a template", "note": "For anything that came back correct and lifeless.", "text": "This reads like a template. Make it read like a person wrote it.\n\nWho reads it: [who actually reads it]\nWhat I want them to do: [what you really want them to do]\n\nThe document:\n[the document]\n\nCut the throat-clearing at the start. Put what I want them to do near the top.\nTake out any sentence that would appear in anybody else's version of this.\nKeep it the same length or shorter."}}, {"day": 10, "course": 9, "title": "DeepSeek", "task": "Working through a problem step by step", "why": "Good for problems with several moving parts, where the order matters and you want to follow the reasoning.", "prompt": "Course 09, the first prompt.", "prompt_text": "I have a problem I need to work through carefully.\n\nThe problem: [what is happening, what you have tried, and\nwhat is not working].\nThe context: [the background, the constraints you are working\nwithin, and what a good outcome looks like].\n\nWork through this step by step, showing your reasoning at each\nstage. Then give me:\n1. The root cause, based on your analysis\n2. Three specific solutions, with the trade-offs of each\n3. Your recommended solution and the clearest reason for it\n4. The first thing I should do in the next 24 hours\n\nDo not give me a fast answer. Think it through first.", "helper": {"title": "Find the step where the reasoning went wrong", "note": "When the answer is wrong but you cannot see where.", "text": "I think this answer is wrong and I want to find where.\n\nWhy I think so: [why you think it is wrong]\n\nThe answer:\n[the answer it gave]\n\nGo back through it step by step. For each step, say whether it holds and what\nit depends on. Find the first step that is wrong or rests on an assumption\nthat was never stated.\n\nIf it turns out to be right and I am the one who is wrong, say that plainly\nand show me why."}}, {"day": 11, "course": 10, "title": "AI For Your Daily Life", "task": "Meal planning and the shopping list", "why": "Give it your household, your budget and your time, and it returns a week of dinners with a list organised by aisle.", "prompt": "Course 10, the first prompt.", "prompt_text": "Plan 5 weeknight dinners for [number] people.\n\nMy constraints:\n- Budget: [your budget] for all five together\n- Time: each should take under [number] minutes\n- Dietary needs: [anything relevant, such as no seafood,\n  vegetarian on Tuesdays, a nut allergy, or a picky eater,\n  or write none]\n- Already planned this week: [anything you know you are\n  making, so it is not repeated, or write none]\n\nFor each dinner give me the name, a rough time to make it,\nand the ingredients I need to buy rather than the ones I\nprobably already have.\n\nThen a full shopping list organised by section: produce,\ndairy, meat, pantry.", "helper": {"title": "Swap out what nobody will eat", "note": "Meal plans come back ideal rather than realistic.", "text": "Change this plan to fit real life.\n\nWhat will not work: [what will not work]\n\nThe plan:\n[the plan it gave you]\n\nReplace only the meals that are a problem, keep the rest, and update the\nshopping list to match. Do not give me a whole new plan.\n\nThen tell me which two meals could be made once and eaten twice."}}, {"day": 12, "course": 11, "title": "AI For Video Content", "task": "Knowing what to say before you film", "why": "Use this before you record anything, so you are not improvising in front of a camera.", "prompt": "Course 11, the first prompt.", "prompt_text": "Write a script for a short video, under 60 seconds.\n\nTopic: [the one thing you want to say].\nWho is watching: [your audience].\nWhat I want them to do after: [follow / comment / click].\nHow I talk: [warm / direct / funny / plain].\n\nRules:\n- Open with a line that stops a scroll, before any introduction\n- One idea only, no list of five things\n- Short sentences I can say out loud without stumbling\n- Tell me roughly how long each part should take\n- End with one clear thing to do\n\nWrite it the way I would speak, not the way I would write.", "helper": {"title": "Make the first line worth staying for", "note": "The script is fine. The opening is doing nothing.", "text": "The body of this script is fine. The opening is not.\n\nWho I am trying to reach: [who you are trying to reach]\n\nThe script:\n[the script]\n\nGive me five new opening lines, each under twelve words, each something I\nwould actually say out loud. No greeting, no announcing the topic.\n\nThen rewrite the first fifteen seconds around the strongest one, so the\nopening and what follows actually join up."}}, {"day": 13, "course": 12, "title": "AI For Students", "task": "Starting where you actually are", "why": "Instead of a course that begins at the beginning, get an explanation pitched exactly at the point where you lose the thread.", "prompt": "Course 12, the first prompt.", "prompt_text": "I want to understand [the subject].\n\nWhat I already know: [be honest about your level].\nWhere it stops making sense: [the specific point you lose it].\nWhy I want this: [what you will do with it].\n\nPlease:\n1. Start from where my understanding stops, not from the\n   basics.\n2. Explain it in plain language with one concrete example.\n3. Tell me what people commonly get wrong about this.\n4. Then ask me three questions to check I followed it.\n\nDo not flatter me and do not skip ahead.", "helper": {"title": "Work out what to study first", "note": "When the honest answer is that there is too much.", "text": "I am behind and I need to decide what to do first.\n\nWhat I am behind on: [what you are behind on]\nDeadline: [when the deadline is]\nHours I realistically have: [roughly how many hours you have]\n\nTell me:\n1. What to do first, second and third, and why in that order.\n2. What to deliberately not do, given the time I have.\n3. What I can do badly and still be fine.\n4. The one thing that would cost me most to skip.\n\nBe honest about what will not fit rather than fitting it all in."}}, {"day": 14, "course": 13, "title": "AI For Parents", "task": "Explaining something to a child", "why": "For homework you cannot remember how to do, or questions you cannot answer without going down a rabbit hole.", "prompt": "Course 13, the first prompt.", "prompt_text": "Explain [the topic] to a [age] year old.\n\nWhat they already know: [roughly where they are].\nWhere they are getting stuck: [the specific bit, if you know].\n\nPlease:\n1. Explain it in plain words with one everyday example.\n2. Do not use technical terms without explaining them first.\n3. Give me two questions I can ask to check they followed it.\n4. Suggest one way to make it stick, such as a game or a\n   thing to draw.\n\nDo not do the homework for them. Help me help them.", "helper": {"title": "Try it again a different way", "note": "When the explanation did not work for your child.", "text": "That explanation did not work. They are [how old they are].\n\nWhat I tried: [how it was explained]\nWhat happened: [what they said or did]\n\nTry completely differently. Not the same explanation in simpler words, a\ndifferent way in: a story, a question back to them, something they can do with\ntheir hands, or a comparison to something in their own life.\n\nGive me two different approaches, and tell me which you would try first with a\nchild who reacted like that."}}, {"day": 15, "course": 14, "title": "AI, Privacy and Safety", "task": "Deciding what never to paste", "why": "The simplest safety habit is a short list of things that never go into any AI tool, decided once rather than in the moment.", "prompt": "Course 14, the first prompt.", "prompt_text": "Help me decide what I should never put into an AI tool.\n\nWhat I use AI for: [your tasks].\nWhat I handle that might be sensitive: [client details,\nhealth information, money, other people's private messages,\nwork documents, or whatever applies].\n\nGive me:\n1. A clear list of what I should never paste in, and why.\n2. What is fine to share, so I am not over-cautious.\n3. How to get the same help without sharing the sensitive\n   part, with an example of rewording a request.\n4. What to check in a tool's settings to limit what is kept.\n\nKeep it practical. I want a rule I can actually remember.", "helper": {"title": "Rewrite it with nothing private in it", "note": "For when you need the help but not the risk.", "text": "I want help with this but I should not paste it as it is.\n\nWhat I need help with: [what you need help with]\n\nThe text:\n[what you wanted to paste]\n\nRewrite it with every identifying detail removed or replaced: names, company\nnames, addresses, account numbers, anything about a specific person's health\nor money. Keep enough that the problem still makes sense.\n\nThen list what you took out, so I know what to put back in my own copy."}}, {"day": 16, "course": 15, "title": "AI For Your Career Right Now", "task": "Clearing the admin half of your job", "why": "Meeting notes, long threads and routine replies. The work that fills the day without being the job.", "prompt": "Course 15, the first prompt.", "prompt_text": "Here are my rough notes from a meeting:\n\n[paste your notes, however messy]\n\nTurn these into:\n1. A short summary anyone who missed it could read.\n2. The decisions that were made, listed plainly.\n3. The actions, with who owns each one and by when, based\n   only on what my notes actually say.\n4. Anything my notes leave unclear that I should check\n   before sending this round.\n\nDo not invent actions or owners that are not in my notes.\nFlag the gaps instead.", "helper": {"title": "Hand the rest of it over", "note": "Once the first batch worked, do the pile.", "text": "That worked. I have more of the same.\n\nWhat worked: [what worked the first time]\nWhat else is in the pile: [what else is in the pile]\n\nTurn what worked into something reusable: a short prompt I can paste each\ntime, with the parts I change marked clearly.\n\nThen tell me what would make this go wrong if I used it without reading the\nresult, so I know what to check each time."}}, {"day": 17, "course": 16, "title": "AI For Job Seekers", "task": "Tailoring your resume (CV) to one advert (job posting)", "why": "Not rewriting your resume (CV), but reshaping what is already true about you to match what this particular advert (job posting) is asking for.", "prompt": "Course 16, the first prompt.", "prompt_text": "Here is my resume (CV): [paste it]\n\nHere is the advert (job posting): [paste it]\n\nDo not invent anything. Use only what is in my resume.\n\nTell me:\n1. What this advert is really asking for, including what it\n   implies rather than states.\n2. Which of my existing experience matches, and which I have\n   buried too far down.\n3. A rewritten summary at the top, tailored to this role.\n4. Which bullet points to reorder, reword or cut, and why.\n5. What genuine gap I have against this role, and how to\n   address it honestly in a cover letter.\n\nBe honest about the gap. I would rather know before applying.", "helper": {"title": "Find the gap and say it honestly", "note": "Before you decide whether to apply at all.", "text": "Compare these honestly.\n\nMy resume:\n[your resume]\n\nThe job posting:\n[the job posting]\n\nTell me:\n1. What they are asking for that I genuinely have, in their words.\n2. What they are asking for that I do not have.\n3. Whether the gap is the sort that stops an application or the sort everyone\n   has.\n4. Whether it is worth applying, straight.\n\nDo not encourage me. If this is a stretch, say it is a stretch and tell me\nwhat would make it less of one."}}, {"day": 18, "course": 17, "title": "AI For Productivity", "task": "Planning a week you will actually finish", "why": "Use this on a Sunday evening or a Monday morning, before anything else.", "prompt": "Course 17, the first prompt.", "prompt_text": "Help me plan a week I can actually finish.\n\nWhat has to happen this week: [list everything].\nHours I genuinely have: [be honest, after work and family].\nWhat always eats my time unexpectedly: [name it].\nWhat matters most if I only do one thing: [the one thing].\n\nGive me:\n1. The three things worth doing, in order.\n2. Roughly when each one fits, given my real hours.\n3. What I am not doing this week, said plainly.\n4. The one thing to protect if the week goes wrong.\n\nDo not give me a list of ten. I will finish none of them.", "helper": {"title": "Cut the week down to what will fit", "note": "Every first plan has too much in it.", "text": "This plan has too much in it.\n\nWhat actually happened last week: [what actually happened last week]\n\nThe plan:\n[the plan]\n\nCut it to what will genuinely fit. Tell me what you removed and why. Mark the\ntwo things that must happen even if the week falls apart, and the three that\nwere never going to happen.\n\nBe realistic rather than encouraging."}}, {"day": 19, "course": 18, "title": "AI For Business", "task": "Finding the idea you already have", "why": "Most people already know something worth selling and discount it. This finds it and tells you honestly whether it would sell.", "prompt": "Course 18, the first prompt.", "prompt_text": "Help me find a digital product idea I could actually sell.\nI have never done this before.\n\nThings I know, have done, or people ask my advice about:\n[list 3 to 5, such as meal planning, organising a home, using\nCanva, writing resumes, budgeting, or a skill from your job]\n\nMy situation: I have [plenty of / limited] time.\nI want something [simple and fast / more detailed].\n\nTell me:\n1. Which idea from my list would sell best, and exactly why.\n2. Who would buy it, described specifically.\n3. What format suits it: guide, checklist, prompt pack or\n   template.\n4. Honestly, is this worth building? Say so if it is not.", "helper": {"title": "Pressure test the idea", "note": "Before you spend a week building it.", "text": "Pressure test this idea before I build it.\n\nThe idea: [the idea]\nWhat evidence I have: [any evidence you have]\n\n1. Who exactly would buy this, and what are they doing instead right now?\n2. What has to be true for this to work, and which of those is least certain?\n3. What is the smallest version I could put in front of someone this week to\n   find out?\n4. What would make you say do not build this?\n\nArgue against it properly rather than listing pros and cons."}}, {"day": 20, "course": 19, "title": "AI For Finance", "task": "Seeing where your money actually goes", "why": "Use this on your household, your business, or both. Describing it honestly is most of the work.", "prompt": "Course 19, the first prompt.", "prompt_text": "Help me understand where the money goes. Rough numbers\nare fine. This is for my [household / business].\n\nComing in each month: [roughly].\nFixed things I cannot easily change: [rent or mortgage,\ntravel, bills, anything else].\nThings that vary: [food, going out, shopping, whatever\napplies].\nWhat I owe, if anything: [be honest, or write none].\n\nTell me:\n1. Where most of it actually goes, in plain terms.\n2. Which part is probably bigger than I realise.\n3. What looks normal and is not worth worrying about.\n4. One question I should ask myself before changing anything.", "helper": {"title": "Make sense of what the numbers show", "note": "Once you can see where the money goes.", "text": "Here is where my money actually went.\n\nWhat surprised me: [what surprised you]\nWhat I am trying to change: [what you are trying to change]\n\nThe breakdown:\n[what you found]\n\nTell me:\n1. What is genuinely out of line, rather than just large because it has to be.\n2. What is small but happening often, which is usually the easier fix.\n3. The one change that gets me furthest towards [what you are trying to change].\n4. What is not worth touching, so I stop feeling bad about it.\n\nUse only my figures."}}, {"day": 21, "course": 10, "title": "AI For Your Daily Life", "task": "Writing the message you are avoiding", "why": "For emails you keep putting off and messages you want to get exactly right before you send them.", "prompt": "Course 10, the second prompt.", "prompt_text": "Help me write [an email / a text / a WhatsApp message /\na reply] to [who they are and your relationship with them].\n\nThe situation: [what happened or what needs saying, honestly,\nincluding your part in it if that matters].\nWhat I want to achieve: [say no politely / apologise without\nover-explaining / set a limit / ask for something / address a\nproblem directly].\nWhat I am worried about: [what you fear will happen if you\nsend it].\n\nWrite two versions:\nVersion 1, short and direct, under 60 words.\nVersion 2, warmer and fuller, under 120 words.\nNo greeting. Just the body of the message.", "helper": {"title": "Take the edge off before you send it", "note": "Read it back once, then run this.", "text": "I am about to send this. Check it first.\n\nWho it is going to: [who it is going to]\nWhat I want to happen: [what you want to happen]\n\nThe message:\n[the message]\n\nTell me:\n1. How it will land, honestly, including anything that reads sharper than I\n   mean it.\n2. Any sentence doing nothing, that I could cut.\n3. Anywhere I am apologising or over-explaining.\n4. Whether what I want is actually clear in it.\n\nThen give me the tightened version. Keep my voice."}}, {"day": 22, "course": 12, "title": "AI For Students", "task": "A study plan you will actually follow", "why": "Most learning plans fail because they assume more time than you have. This one is built around the time you really have.", "prompt": "Course 12, the second prompt.", "prompt_text": "Build me a realistic plan to learn [the subject].\n\nTime I genuinely have: [minutes per day, and which days].\nMy deadline, if any: [a date, or write none].\nHow I learn best: [reading / watching / doing / being tested].\nWhat I already know: [your starting point].\n\nGive me:\n1. A week by week plan that fits the time I actually have.\n2. What to do in each session, specifically.\n3. How I will know I have understood each part.\n4. What to skip, because it is not worth my time yet.\n\nBe realistic. A plan I abandon is worse than a short one.", "helper": {"title": "Rebuild the plan after you fall behind", "note": "For week two, when it has already slipped.", "text": "I am behind on my own study plan.\n\nThe plan: [the plan you made]\nWhat I actually did: [what you actually did]\nTime left: [how long until the deadline]\n\nDo not tell me to try harder. Rebuild it around what is left.\n\n1. What to drop entirely, given the time.\n2. A revised plan that fits the days I actually have.\n3. Why the first plan failed, based on the gap between it and what I did.\n4. One change that makes this version more likely to survive."}}, {"day": 23, "course": 13, "title": "AI For Parents", "task": "Planning a day out or a trip", "why": "Planning is the part that stops things happening. Hand it the constraints and it does the tedious bit.", "prompt": "Course 13, the second prompt.", "prompt_text": "Plan a [day out / weekend / trip] for [who is going,\nincluding ages].\n\nWhere: [the area or town].\nBudget: [roughly what you want to spend].\nHow long: [the time you have].\nWhat matters: [what everyone actually enjoys, and anything\nto avoid, such as long walks or loud places].\nGetting there: [car / public transport / walking].\n\nGive me a realistic plan with rough timings, one backup for\nbad weather, and what to take. Do not pack it too full.", "helper": {"title": "Plan for the day going wrong", "note": "The part every day out plan leaves out.", "text": "Here is the plan for a day out. Tell me what will go wrong.\n\nWho is coming: [who is coming]\nWhat usually goes wrong: [what usually goes wrong]\n\nThe plan:\n[the plan]\n\nGive me:\n1. The three points in this day most likely to fall apart, and when.\n2. What to have in the bag because of each one.\n3. The part of the plan to drop first if we are running late.\n4. A realistic timing check: is there too much in this day?\n\nBe blunt about what is too ambitious."}}, {"day": 24, "course": 15, "title": "AI For Your Career Right Now", "task": "Making your case in writing", "why": "For proposals, requests and the email where you need someone senior to agree to something.", "prompt": "Course 15, the second prompt.", "prompt_text": "Help me write [a proposal / a request / an email] to\n[who it goes to and their role].\n\nWhat I want them to agree to: [the specific thing].\nWhy it is worth doing: [your reasons].\nWhat it costs, in time or money or risk: [be honest].\nWhat they care about most: [their priorities, not yours].\nWhat they will push back on: [the objection you expect].\n\nWrite it so that:\n- The request is clear in the first three lines\n- It is framed around what they care about\n- The objection is answered before they raise it\n- It stays under [your limit] words\n\nNo padding and no corporate language.", "helper": {"title": "Make the case shorter and harder to refuse", "note": "For anything you are asking someone senior to approve.", "text": "Tighten this so it is harder to say no to.\n\nWho decides: [who decides]\nWhat I am asking for: [exactly what you are asking for]\n\nMy case:\n[your case]\n\n1. Put the ask in the first two sentences.\n2. Cut anything that is justification rather than evidence.\n3. Say what it costs them to do nothing, if that is honestly the case.\n4. Take out anything that invites a question I cannot answer.\n\nThen tell me the objection they are most likely to raise, and one sentence to\nhandle it."}}, {"day": 25, "course": 16, "title": "AI For Job Seekers", "task": "A cover letter that sounds like you", "why": "Most cover letters read like a template because they are one. This starts from your actual reason for wanting the job.", "prompt": "Course 16, the second prompt.", "prompt_text": "Write a cover letter for this role.\n\nThe advert (job posting): [paste it or summarise it]\nMy relevant experience: [three or four things, honestly]\nWhy I actually want this job: [the real reason, even if it\nis practical rather than inspiring]\nWhat I am slightly worried about: [any gap or concern]\nHow I write: [warm / direct / formal]\n\nRules:\n- Under 300 words\n- Do not open with \"I am writing to apply for\"\n- Do not repeat my resume (CV) back at them\n- Address the gap once, briefly, without apologising\n- End with a clear, specific next step\n\nSound like a person who wants this job, not a template.", "helper": {"title": "Check the letter does not repeat the resume", "note": "The most common fault with a cover letter.", "text": "Check my cover letter against my resume.\n\nThe letter:\n[the letter]\n\nMy resume:\n[your resume]\n\nTell me:\n1. Anything in the letter that just repeats the resume, which is wasted space.\n2. Whether the real reason I want this job actually comes through, or whether\n   it reads like it could be any job.\n3. Whether it sounds like a person or like a template.\n4. What to cut so it comes in under 300 words.\n\nThen give me the tightened version."}}, {"day": 26, "course": 17, "title": "AI For Productivity", "task": "Breaking down the thing you keep avoiding", "why": "Use this on whatever has moved down your list three weeks running.", "prompt": "Course 17, the second prompt.", "prompt_text": "There is something I keep putting off.\n\nThe task: [what it is].\nHow long it has been on my list: [be honest].\nWhy I think I am avoiding it: [your real guess, even if it\nis that it is boring or that I am worried about it].\nHow much time I could give it today: [realistically].\n\nTell me:\n1. What is actually making this hard. Be honest with me.\n2. The smallest possible first step, something I could do\n   in the time I named.\n3. What done looks like, so I know when to stop.\n4. What happens if I simply never do it.", "helper": {"title": "Make the first step small enough to do today", "note": "If you are still avoiding it, the first step is too big.", "text": "I still have not started, so the first step is too big.\n\nThe thing: [the thing you are avoiding]\nWhat is actually stopping me: [what is actually stopping you]\n\nThe breakdown:\n[the breakdown it gave you]\n\nMake the first step something I can finish in ten minutes, today, without\nneeding anything I do not already have. Then the next one.\n\nIf what is stopping me is not really about the task, say so and tell me what\nwould actually unblock it."}}, {"day": 27, "course": 18, "title": "AI For Business", "task": "Building the product itself", "why": "Once you have the idea, this writes the whole thing, section by section, ready for you to add your own examples.", "prompt": "Course 18, the second prompt.", "prompt_text": "I am making a digital product called [working title],\nfor [your buyer], solving [the problem].\n\nGive me:\n1. The full outline: every section, with one line on what it\n   covers and why it is there.\n2. Then write the content for each section, one at a time,\n   stopping after each so I can read it.\n\nEvery section must give the reader something concrete to do\nor know. No filler and no padding to make it look longer.\n\nLeave a clearly marked gap in each section where my own\nexample or story should go.", "helper": {"title": "Find what is missing before you launch", "note": "The gap between nearly done and actually sellable.", "text": "Here is what I have built. Tell me what is missing.\n\nWhat it is and where it is up to: [what you have built]\nWho it is for: [who it is for]\nWhen I want to launch: [when you want to launch]\n\n1. What a buyer would expect that is not there yet.\n2. What I think matters that does not.\n3. The three things to finish first, in order.\n4. What I could launch without, and add afterwards.\n\nIf it is ready enough and I am stalling, say that."}}, {"day": 28, "course": 19, "title": "AI For Finance", "task": "Deciding what to change first", "why": "Use this once you can see the picture, so you change one thing rather than everything.", "prompt": "Course 19, the second prompt.", "prompt_text": "Here is my situation: [paste what you worked out\nin the last task].\n\nWhat I want: [save a set amount / clear something I owe /\nhave more left at month end / just stop worrying].\nWhat I am not willing to give up: [be honest, it matters].\n\nTell me:\n1. The single change that would make the most difference.\n2. What it is actually worth over a year.\n3. Two smaller changes I would barely notice.\n4. What to leave alone, because cutting it would not last.\n\nOne change, not a plan with nine parts.", "helper": {"title": "Work out the first change properly", "note": "Before you change anything, check it is the right thing.", "text": "I have decided what to change first. Check my reasoning.\n\nWhat I decided: [what you decided to change]\nWhy that one: [why that one]\nWhat I am worried it will affect: [what you are worried it will affect]\n\nTell me:\n1. Whether this is the change with the biggest effect, or just the most\n   obvious one.\n2. What it knocks on to that I may not have thought about.\n3. How I will know in a month whether it worked.\n4. What I should leave alone for now.\n\nIf there is a better first change, say so and say why."}}, {"day": 29, "course": 11, "title": "AI For Video Content", "task": "Turning one recording into a week of posts", "why": "Use this after filming anything longer than a couple of minutes.", "prompt": "Course 11, the second prompt.", "prompt_text": "Here is the transcript of a video I recorded:\n\n[paste the transcript]\n\nMy audience: [who they are].\n\nGive me:\n1. The three best 30 second sections to cut as clips, quoting\n   the first and last line of each so I can find them.\n2. A written post built from the strongest idea.\n3. A short email to my list on the same thing.\n4. Five lines worth putting on screen as captions.\n\nKeep my words wherever they already work.", "helper": {"title": "Choose which clip to post first", "note": "You have the pieces. Now pick the order.", "text": "I have a week of content out of one recording. Help me order it.\n\nWhere I post: [where you are posting]\nWhat I want from it: [what you want from it]\n\nWhat I have:\n[what you got out of it]\n\nTell me:\n1. Which one to post first, and why that one.\n2. The order for the rest, and roughly how far apart.\n3. Which is weakest and could be dropped.\n4. One line to put with each, in my voice, not a caption written by a machine."}}, {"day": 30, "course": null, "title": "Look back at the month", "task": "Read back what you wrote on each day, then post what changed.", "why": "Thirty days ago you had not used any of this. Today you have done it twenty nine times. That is worth noticing.", "prompt": "Work out what to keep.", "prompt_text": "I have just finished thirty days of using AI, one task a day.\n\nWhat I actually used it for: [the things you came back to]\nWhat genuinely worked: [be specific]\nWhat I tried once and never used again: []\nWhat still feels hard: []\n\nPlease:\n1. Tell me which three of these to keep doing every week, and why those three.\n2. Tell me what to stop bothering with, so I am not carrying things that are\n   not earning their place.\n3. Name the one thing I am still avoiding that would make the biggest\n   difference, based on what I have told you.\n4. Build me a short weekly routine, twenty minutes at most, out of only the\n   things I said actually worked.\n\nDo not add anything new. I want less to do, not more.", "helper": {"title": "Write what actually changed", "note": "For the post on day thirty, in your own words.", "text": "I have finished thirty days of this. Help me write what changed.\n\nWhat I was like before: [what you were like before you started]\nWhat I still cannot do: [what you still cannot do]\n\nMy notes from the month:\n[what you wrote across the month]\n\nWrite a short post, under 200 words, in my own words. Not a success story.\n\n1. What I can do now that I could not do a month ago, specifically.\n2. The one that surprised me most.\n3. What I still find hard, said plainly.\n4. The one thing I would tell someone starting today.\n\nNo hype. If the month was mixed, let it read as mixed."}}];const WEEKS={"1": "Getting set up and understanding it", "2": "Meeting the tools", "3": "Putting it into your week", "4": "Work, money and what you do next"};</script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const K='aim30';
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){S={}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('on');
  setTimeout(()=>x.classList.remove('on'),1500)}

function render(){
  let h='',wk=0;
  DAYS.forEach(d=>{
    const w=Math.min(4,Math.floor((d.day-1)/7)+1);
    if(w!==wk){wk=w;h+=`<div class="wk">Week ${w} &middot; ${esc(WEEKS[w])}</div>`}
    const st=S[d.day]||{};
    h+=`<div class="day${st.done?' done':''}" data-d="${d.day}">
      <div class="dhead">
        <button class="tick" data-tick="${d.day}" aria-label="Mark day ${d.day} done"></button>
        <div class="dmain">
          <div class="dno">Day ${d.day}${d.course?' &middot; Course '+String(d.course).padStart(2,'0'):''}</div>
          <div class="dtask">${esc(d.task)}</div>
          <div class="dcourse">${esc(d.title)}</div>
        </div>
      </div>
      <div class="dbody">
        <p class="why">${esc(d.why)}</p>
        ${d.prompt_text?`<div class="pblock">
          <div class="plabel">${esc(d.prompt)}</div>
          <div class="hout">${esc(d.prompt_text)}</div>
          <button class="btn ghost pcopy" data-c="${d.day}">Copy this prompt</button>
        </div>`:`<p class="why" style="color:var(--purple2)">${esc(d.prompt)}</p>`}
        ${d.helper?`<div class="helper">
          <div class="hhead">If it did not quite work</div>
          <div class="hbody" id="h${d.day}">
            <div class="htitle">${esc(d.helper.title)}</div>
            <p class="why">${esc(d.helper.note)}</p>
            <div class="hout">${esc(d.helper.text)}</div>
            <button class="btn ghost hcopy" data-c="${d.day}">Copy this prompt</button>
          </div></div>`:''}
      </div></div>`;
  });
  $('#days').innerHTML=h;
  $$('.dhead').forEach(e=>e.onclick=ev=>{
    if(ev.target.closest('[data-tick]'))return;
    e.closest('.day').classList.toggle('open');
  });
  $$('[data-tick]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.tick;S[d]=S[d]||{};S[d].done=!S[d].done;save();stats();
    b.closest('.day').classList.toggle('done',S[d].done);
  });
  $$('.pcopy').forEach(b=>b.onclick=async()=>{
    const el=b.parentElement.querySelector('.hout');
    try{await navigator.clipboard.writeText(el.textContent)}
    catch(e){const r=document.createRange();r.selectNode(el);
      getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand('copy')}
    toast('Copied');
  });
  $$('.hcopy').forEach(b=>b.onclick=async()=>{
    const txt=document.querySelector('#h'+b.dataset.c+' .hout').textContent;
    try{await navigator.clipboard.writeText(txt)}
    catch(e){const r=document.createRange();
      r.selectNode(document.querySelector('#h'+b.dataset.c+' .hout'));
      getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand('copy')}
    toast('Copied');
  });
  stats();
}

function stats(){
  const done=DAYS.filter(d=>(S[d.day]||{}).done).length;
  let streak=0;
  for(const d of DAYS){if((S[d.day]||{}).done)streak++;else break}
  $('#done').textContent=done;
  $('#left').textContent=30-done;
  $('#streak').textContent=streak;
  $('#barfill').style.width=(done/30*100)+'%';
}

$('#copy').onclick=async()=>{
  const done=DAYS.filter(d=>(S[d.day]||{}).done);
  const t=done.length
    ?('My 30 days with AI Made Simple\n\n'+done.length+' of 30 done\n\n'+
      done.map(d=>`Day ${d.day} - ${d.task}`).join('\n'))
    :'Nothing ticked off yet.';
  try{await navigator.clipboard.writeText(t)}catch(e){}
  toast(done.length?'Copied':'Nothing ticked off yet');
};
$('#openall').onclick=()=>{const any=$$('.day.open').length;
  $$('.day').forEach(d=>d.classList.toggle('open',!any))};
render();
</script>
</body></html>
